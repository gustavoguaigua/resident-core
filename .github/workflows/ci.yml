name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Required CI gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://resident:synthetic_ci_only@127.0.0.1:5432/resident_core?schema=public
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: resident_core
          POSTGRES_USER: resident
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resident -d resident_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.21.0"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: API bootstrap security tests
        run: pnpm test:api

      - name: Check OpenAPI runtime contract drift
        run: pnpm openapi:check

      - name: Validate OpenAPI runtime contract
        run: pnpm openapi:validate

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Verify Sprint 1 scope boundary
        run: pnpm sprint1:boundary

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Dependency audit
        run: pnpm security:dependencies

      - name: Secret scan
        run: pnpm security:secrets

      - name: Build workspace
        run: pnpm build

      - name: Build resident-api image
        run: docker compose build resident-api
