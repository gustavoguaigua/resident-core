services:
  postgres-authorization:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: resident_authorization
      POSTGRES_PASSWORD: ${AUTHORIZATION_PHASE5_DB_PASSWORD}
      POSTGRES_USER: resident_authorization
    ports:
      - "127.0.0.1:${AUTHORIZATION_PHASE5_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U resident_authorization -d resident_authorization",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
