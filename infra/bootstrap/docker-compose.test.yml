services:
  postgres-bootstrap:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: resident_bootstrap
      POSTGRES_USER: resident_bootstrap
      POSTGRES_PASSWORD: ${BOOTSTRAP_PHASE4_DB_PASSWORD:?required}
    ports:
      - "127.0.0.1:55437:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U resident_bootstrap -d resident_bootstrap"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  keycloak-bootstrap-postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_PHASE4_DB_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-bootstrap-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_PHASE4_DB_PASSWORD:?required}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:18084
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
    depends_on:
      keycloak-bootstrap-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18084:8080"
    volumes:
      - ../keycloak/realm/resident-realm.json:/opt/keycloak/data/import/resident-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
